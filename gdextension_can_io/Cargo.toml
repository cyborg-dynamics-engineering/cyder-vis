[package]
name = "gdextension_can_io"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"] # Compile this crate to a dynamic C library.

[dependencies]
godot = { version = "0.4.5", features = ["experimental-threads"] }
serde_json = "1.0.142"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
nb = "1.1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
can-dbc = "8.0.0"
crosscan = { git = "https://github.com/Cyborg-Dynamics-Engineering/cross-can.git", rev = "71f14a3d4bc3601c16332de62fa72aa6688d6b8a" }
tokio = "1.47.1"

[target.'cfg(windows)'.dependencies]
serialport = "4.7.2"
libloading = "0.8"
