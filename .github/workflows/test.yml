name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MF4 test dependencies
        run: python -m pip install "python-can[mf4]>=4.6,<5" "asammdf>=8,<9"
      - name: Install Godot and configure tests
        shell: python
        run: |
          import os
          import pathlib
          import stat
          import sys
          import urllib.request
          import zipfile
          platform = 'win64.exe' if os.name == 'nt' else 'linux.x86_64'
          name = f'Godot_v4.5-stable_{platform}'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'godot.zip'
          urllib.request.urlretrieve(f'https://github.com/godotengine/godot-builds/releases/download/4.5-stable/{name}.zip', archive)
          destination = archive.parent / 'godot'
          with zipfile.ZipFile(archive) as package:
              package.extractall(destination)
          binary = destination / (name.replace('.exe', '_console.exe') if os.name == 'nt' else name)
          binary.chmod(binary.stat().st_mode | stat.S_IXUSR)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'GODOT_BIN={binary}\nCYDERVIS_MF4_PYTHON={sys.executable}\n')
      - name: Rust tests including MF4 read-back
        run: cargo test --manifest-path gdextension_can_io/Cargo.toml --locked --lib
      - name: Build extension
        run: cargo build --manifest-path gdextension_can_io/Cargo.toml --locked
      - name: Godot integration tests
        run: python godot/tests/run_tests.py
